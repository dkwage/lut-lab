[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lut-lab"
version = "0.1.0"
description = "Local LUT preview, editing and RAW development lab"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "numpy==2.5.3; python_version >= '3.12'",
  "numpy>=2.0,<2.4; python_version < '3.12'",
  "pillow==12.3.0",
  "rawpy==0.27.1",
  "pydantic==2.13.5",
]

[dependency-groups]
app = ["pywebview==6.2.1", "pyinstaller==6.22.3"]
dev = [
    "httpx>=0.28.1",
]
test = ["httpx==0.28.1"]

[project.scripts]
lut-lab = "lutlab.server:main"
lut-lab-app = "lutlab.app:main"

[tool.setuptools.packages.find]
include = ["lutlab*"]

[tool.setuptools.package-data]
lutlab = ["static/*.html", "static/fonts/*"]
